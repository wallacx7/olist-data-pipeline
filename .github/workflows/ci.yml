name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    name: Python tests (utils + DAG import)
    runs-on: ubuntu-latest
    env:
      # DagBag parsing imports both DAG files, and olist_raw_ingestion_dag.py
      # reads GCP_PROJECT_ID at module scope (os.environ["GCP_PROJECT_ID"]) —
      # without it, importing that DAG raises KeyError. Placeholder value only;
      # no BigQuery call is ever made by these tests.
      GCP_PROJECT_ID: ci-placeholder-project
      # Keeps Airflow's default sqlite metadata db inside the runner's
      # workspace instead of touching the runner's home directory.
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_home
      # olist_dbt_transformation_dag.py reads these to locate the dbt project
      # and profile — defaults to /opt/airflow/... (container-only paths), so
      # here they're pointed at the checkout and a CI-only profile instead.
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
      DBT_PROFILES_DIR: ${{ github.workspace }}/.dbt_profiles_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.9.3/constraints-3.11.txt \
            -r requirements-dev.txt

      - name: Write a dummy dbt profile (no real credentials involved)
        # Cosmos reads the dbt project + profile while *parsing* the DAG
        # (to build the task graph), not just when it runs — the DagBag
        # import test below needs a resolvable profile for the same reason
        # `dbt parse` does in the other job. No real GCP connection happens.
        run: |
          mkdir -p "$DBT_PROFILES_DIR"
          cat > "$DBT_PROFILES_DIR/profiles.yml" <<'EOF'
          olist_data_pipeline:
            target: default
            outputs:
              default:
                type: bigquery
                method: service-account
                project: ci-placeholder-project
                dataset: ci_placeholder
                keyfile: /dev/null
                threads: 1
          EOF

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: Run pytest
        run: pytest tests/ -v

  dbt-parse:
    name: dbt project sanity check (no warehouse connection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-bigquery
        run: pip install dbt-bigquery

      - name: Write a dummy profile (no real credentials involved)
        # `dbt parse` only needs a profile that *resolves* — it does not open
        # a connection to BigQuery. This catches Jinja/YAML/ref errors (e.g.
        # broken `{{ ref() }}`, missing sources) on every push, without
        # needing real GCP secrets in this repo.
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          olist_data_pipeline:
            target: default
            outputs:
              default:
                type: bigquery
                method: service-account
                project: ci-placeholder-project
                dataset: ci_placeholder
                keyfile: /dev/null
                threads: 1
          EOF

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      - name: dbt parse
        working-directory: dbt
        run: dbt parse
